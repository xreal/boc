name: Boc release
run-name: "Boc v${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable semantic version, for example 0.1.0"
        required: true
        type: string

env:
  BOC_SERVER_VERSION: 0.0.0-beta-19192

concurrency:
  group: boc-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - name: Validate release request
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "boc-beta" ]]; then
            echo "Boc releases must run from boc-beta"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version"
            exit 1
          fi
          tag="v${VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            existing=$(git rev-list -n 1 "$tag")
            if [[ "$existing" != "$GITHUB_SHA" ]]; then
              echo "${tag} already points to ${existing} instead of ${GITHUB_SHA}"
              exit 1
            fi
          fi

  verify:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Fetch upstream beta
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream beta

      - name: Type-check Boc package
        working-directory: packages/boc
        run: bun typecheck

      - name: Test Boc package
        working-directory: packages/boc
        run: bun run test

      - name: Type-check desktop package
        working-directory: packages/desktop
        run: bun typecheck

      - name: Test desktop package
        working-directory: packages/desktop
        run: bun test

      - name: Audit fork integration surface
        run: bun packages/boc/scripts/audit-fork-surface.ts

  build-cli:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Build bundled CLI binaries
        run: bun ./packages/cli/script/build.ts
        env:
          BUN_COMPILE_RELEASE: bun-v1.4.2
          GITHUB_TOKEN: ${{ github.token }}
          OPENCODE_CHANNEL: boc
          OPENCODE_VERSION: ${{ env.BOC_SERVER_VERSION }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boc-cli
          path: packages/cli/dist/cli-*
          if-no-files-found: error
          retention-days: 7

  build-electron:
    needs: build-cli
    environment: release
    permissions:
      contents: read
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        settings:
          - runner: macos-15
            target: aarch64-apple-darwin
            platform_flags: --mac --arm64
            install_flags: --os=darwin --cpu=arm64
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform_flags: --win --x64
            install_flags: ""
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform_flags: --linux --x64
            install_flags: ""
    runs-on: ${{ matrix.settings.runner }}
    env:
      OPENCODE_CHANNEL: boc
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
      OPENCODE_CLI_TARGET: ${{ matrix.settings.target }}
      OPENCODE_VERSION: ${{ inputs.version }}
      OPENCODE_WINDOWS_SIGNING: "false"
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: boc-cli
          path: packages/cli/dist

      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2.0.0
        if: runner.os == 'macOS'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Prepare Apple notarization key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: printf '%s' "$APPLE_API_KEY_P8_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/apple-api-key.p8"

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.install_flags }}

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Prepare desktop resources
        working-directory: packages/desktop
        run: bun ./scripts/prepare.ts

      - name: Build desktop application
        working-directory: packages/desktop
        run: bun run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package desktop application
        working-directory: packages/desktop
        run: bunx electron-builder ${{ matrix.settings.platform_flags }} --publish never --config electron-builder.config.ts
        timeout-minutes: 60
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CSC_KEYCHAIN: build.keychain

      - name: Verify macOS signatures and notarization
        if: runner.os == 'macOS'
        working-directory: packages/desktop
        shell: bash
        run: |
          app=$(find dist -maxdepth 2 -name '*.app' -type d | head -n 1)
          if [[ -z "$app" ]]; then
            echo "Packaged macOS app not found"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=4 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"

      - name: Verify updater metadata exists
        working-directory: packages/desktop
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) test -s dist/latest-mac.yml ;;
            Windows) test -s dist/latest.yml ;;
            Linux) find dist -maxdepth 1 -name 'latest-linux*.yml' -type f -size +0 | grep -q . ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: boc-desktop-${{ matrix.settings.target }}
          if-no-files-found: error
          retention-days: 7
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.zip
            packages/desktop/dist/latest*.yml

  publish:
    needs: build-electron
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: boc-desktop-*
          path: release/input

      - name: Verify AWS CLI
        run: aws --version

      - name: Publish immutable R2 release assets
        run: >-
          bun packages/boc/scripts/release/publish.ts
          --dir release/input
          --manifests-dir release/manifests
          --version ${{ inputs.version }}
          --phase assets

      - name: Create private GitHub release archive
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Boc ${tag}" --generate-notes
          fi
          mapfile -d '' files < <(
            find release/input -type f \
              \( -name '*.AppImage' -o -name '*.blockmap' -o -name '*.deb' -o -name '*.dmg' \
                 -o -name '*.exe' -o -name '*.rpm' -o -name '*.zip' \) -print0
            find release/manifests -type f \( -name '*.txt' -o -name '*.yml' \) -print0
          )
          if (( ${#files[@]} == 0 )); then
            echo "No release files found"
            exit 1
          fi
          gh release upload "$tag" "${files[@]}" --clobber

      - name: Activate Electron updater manifests
        run: >-
          bun packages/boc/scripts/release/publish.ts
          --dir release/input
          --manifests-dir release/manifests
          --version ${{ inputs.version }}
          --phase manifests

      - name: Publish private GitHub release
        env:
          VERSION: ${{ inputs.version }}
        run: gh release edit "v${VERSION}" --draft=false
