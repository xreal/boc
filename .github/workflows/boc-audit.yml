name: BOC fork surface audit

on:
  push:
    branches:
      - v2
  pull_request:
    branches:
      - v2
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Fetch upstream V2
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream v2
      - name: Audit fork surface
        run: bun packages/boc/scripts/audit-fork-surface.ts
      - name: Test Boc release integration
        working-directory: packages/boc
        run: bun test ./scripts
