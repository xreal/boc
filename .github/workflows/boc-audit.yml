name: BOC fork surface audit

on:
  pull_request:
  push:
    branches:
      - boc-beta

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Fetch upstream beta
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream beta
      - name: Audit fork surface
        run: bun packages/boc/scripts/audit-fork-surface.ts
